name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true  # advisory; don't block builds

  docker-build:
    # Verifies the deploy image: it builds, starts with an injected $PORT,
    # serves both the API and the web UI, and contains no .env file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t stock-agent .

      - name: Run container
        run: docker run -d --name app -e PORT=8080 -p 8080:8080 stock-agent

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused \
            http://localhost:8080/api/health
          echo
          curl --fail --silent --show-error http://localhost:8080/ | grep -q "Stock Guide"

      - name: Image contains no secrets
        run: docker exec app sh -c 'test ! -e /app/.env'

      - name: Container logs
        if: always()
        run: docker logs app

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
